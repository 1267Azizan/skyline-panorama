[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skyline-panorama"
version = "1.0.0"
description = "Automated perspective panorama pipeline for hand-held building-facade sweeps (local decimation + sandbox stitching + elevation normalisation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Azizan", email = "azizan12alin@gmail.com" }]
keywords = ["panorama", "stitching", "opencv", "facade", "sandbox", "photogrammetry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
skyline-pano = "skyline_pano.cli:main"

[project.urls]
Homepage = "https://github.com/1267Azizan/skyline-panorama"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
