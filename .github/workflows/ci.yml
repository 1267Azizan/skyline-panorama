name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless PyYAML pytest
          pip install -e .
      - name: Lint (compile)
        run: python -m compileall -q src
      - name: Tests
        run: pytest -q
